name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The real google-services.json holds the team's Firebase config and may not be committed.
      # CI only needs *a* valid file so the build compiles; unit tests never contact Firebase.
      - name: Use placeholder Firebase config when none is committed
        run: |
          if [ ! -f app/google-services.json ]; then
            cp .github/ci/google-services.placeholder.json app/google-services.json
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mahms-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  api:
    name: REST API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mahms
          POSTGRES_PASSWORD: mahms
          POSTGRES_DB: mahms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mahms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The tests reload the schema and the seed, which drops every table first. This points
      # at the throw-away service container above and never at the deployed database.
      DATABASE_URL: postgres://mahms:mahms@localhost:5432/mahms

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test
