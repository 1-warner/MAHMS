# NOTE: tuned for a low-RAM machine (~3 GB free). SerialGC + trimmed native memory
# (metaspace/code-cache/no-tiered-compilation) lets D8 dexing fit. On a machine with
# more free RAM you can simplify this to: -Xmx2048m -Dfile.encoding=UTF-8
org.gradle.jvmargs=-Xmx1450m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:-TieredCompilation -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
