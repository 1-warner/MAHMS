# Build JVM memory. KSP (Room) plus the Compose compiler need a fair amount of metaspace:
# with the old 320 MB cap the daemon ran out part way through kspDebugKotlin. These values
# fit comfortably on a 8 GB machine and on the GitHub Actions runner (16 GB).
# On a very low-RAM machine (under ~4 GB free) fall back to:
#   -Xmx1450m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC
# and keep kotlin.compiler.execution.strategy=in-process.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
